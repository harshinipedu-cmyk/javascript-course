  <body>

    <script>
      /*
      function function1 () {

        console.log(2 + 2);
      }

      function1();
      */

      // Parameter(puts a value into a function).
      // Opposite of return statement.

      function calculateTax(cost, taxPercent = 0.1){
        console.log(cost * taxPercent);
      }

      calculateTax(2000, 0.2);
      calculateTax(5000, 0.2);
      calculateTax(2000); // Second argument is not passed here 
      /* Default Parameters are used in this case.
      If default parameter is not present the parameter will
      take the value undefined, thus resulting in NaN as our 
      output.*/
    </script>

  </body>
</html>
