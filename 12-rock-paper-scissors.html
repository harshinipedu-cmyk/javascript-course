<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="styles/12-rock-paper-scissors.css" >
  </head>

  <body>
    <p class="title">Rock Paper Scissors</p>

    <button class="move-button js-rock-button"><img class="move-icon" src="images/Rock-emoji.png" alt="Rock"></button> 
    
    <button class="move-button js-paper-button"><img class="move-icon" src="images/Paper-emoji.png" alt="Paper"></button>

    <button class="move-button js-scissors-button"><img class="move-icon" src="images/Scissors-emoji.png" alt="Scissors"></button>

    <p class = "js-result result"></p>
    <p class = "js-moves"></p>
    <p class = "js-score score"></p>
    
    <button class = "reset-score-button js-reset-score-button">Reset Score</button>

    <button class = "auto-play-button js-auto-play-button">Auto Play</button>


    <script src="scripts/12-rock-paper-scissors.js"></script>

  </body>
</html>
