<!DOCTYPE html>
<html>
  <head>
      
    <title>Rock Paper Scissors</title>
  </head>

  <body>
    <p>Rock Paper Scissors</p>

    <button onclick = "
      const randomNumber= Math.random(); // Generating a number between [0,1)
      let computerMove = ''; 
      /* assigning an empty string the computer move 
      so that move can be assigned later.
      making computerMove a global variable so that it is 
      defined in the if - statements */

      /*
      dividing the numbers into three parts between 0 and 1, 
      so that we get three partitions:
      1. [0, 1/3) - Rock is assigned as computer move
      2. [1/3, 2/3) - Paper is assigned as computer move
      3. [2/3, 1) - Scissors is assigned as computer move 
      */

      if (randomNumber >= 0 && randomNumber < 1/3){
        computerMove = 'Rock';
      } else if (randomNumber >= 1/3 && randomNumber < 2/3){
        computerMove = 'Paper';
      } else if (randomNumber >= 2/3 && randomNumber < 1){
        computerMove = 'Scissors';
      }

      let result = '';
      /* making result a global variable so that it is defined in the
      if - statements */
      if (computerMove === 'Rock'){
        result = 'Tie';
      } else if (computerMove === 'Paper'){
        result = 'You Lose.';
      } else if (computerMove === 'Scissors'){
        result = 'You Win.';
      }

      alert(`You picked rock. Computer picked ${computerMove}. ${result}`) 
      //popup
    ">Rock</button>
