<!DOCTYPE html>
<html>
  <head>
    <title>Practice - Rock Paper Scissors</title>
  </head>

  <body>
    <p>Rock Paper Scissors</p>

    <button onclick="
      playGame('Rock')
    ">Rock</button>

    <button onclick="
      playGame('Paper')
    ">Paper</button>

    <button onclick="
      playGame('Scissors')
    ">Scissors</button>

    <button onclick="
      score.wins = 0;
      score.losses = 0;
      score.ties = 0;
      localStorage.removeItem('score');
    ">Reset Score</button>
    <script>

      let score = JSON.parse(localStorage.getItem('score'));

      if (!score){
        score = {
          wins: 0,
          losses: 0,
          ties: 0
        }
      }

      function playGame(playerMove) {

        const computerMove = pickComputerMove();
        let result = '';

        if (playerMove === 'Rock'){
          if (computerMove === 'Rock'){
            result = 'Tie.';
          } else if (computerMove === 'Paper'){
            result = 'You Lose.';
          } else{
            result = 'You Win.';
          }
        } else if (playerMove === 'Paper'){
          if (computerMove === 'Rock'){
            result = 'You Win.';
          } else if (computerMove === 'Paper'){
            result = 'Tie.';
          } else{
            result = 'You Lose.';
          }
        } else {
          if (computerMove === 'Rock'){
            result = 'You Lose.';
          } else if (computerMove === 'Paper'){
            result = 'You Win.';
          } else{
            result = 'Tie.';
          }
        }

        if (result === 'You Win.'){
          score.wins += 1
        } else if (result === 'You Lose.'){
          score.losses += 1
        } else{
          score.ties += 1
        }

        localStorage.setItem('score', JSON.stringify(score));

        alert(`You picked ${playerMove}. Computer picked ${computerMove}. ${result}
Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`);
      }

      function pickComputerMove(){

        const randomNumber = Math.random();
        let computerMove = '';

        if (0 <= randomNumber && randomNumber < 1/3){
          computerMove = 'Rock';
        } else if (1/3 <= randomNumber && randomNumber < 2/3){
          computerMove = 'Paper';
        } else{
          computerMove = 'Scissors';
        }

        return computerMove;
      }

    </script>
  </body>
</html>
