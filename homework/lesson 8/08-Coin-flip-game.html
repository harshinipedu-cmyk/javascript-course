<!DOCTYPE html>
<html>
  <head>
    <title>Coin flip game</title>
  </head>

  <body>
     
    <button onclick="
      playGame('Heads')
    ">Heads</button>

    <button onclick="
      playGame('Tails')
    ">Tails</button>

    <button onclick="
      score.wins = 0;
      score.losses = 0;
      localStorage.removeItem('score');
    ">Reset Score</button>

    <script>

      let score = JSON.parse(localStorage.getItem('score'));

      if (!score){
        score = {
          wins: 0,
          losses: 0
        }
      }
      
      function playGame(guess){
        const compGuess = compResult();
        if(compGuess === guess){
          console.log(`you guessed ${guess} and computer guessed ${compGuess}. You win!`);
          score.wins += 1;
        } else{
          console.log(`you guessed ${guess} and computer guessed ${compGuess}. You Lose.`);
          score.losses += 1;
        }

        localStorage.setItem('score',JSON.stringify(score));

        alert(`wins: ${score.wins}, losses: ${score.losses}`);
      }

      function compResult(){
        const randomNumber = Math.random();
        let result = '';

        result = randomNumber < 0.5 ? 'Heads' : 'Tails';
        return result;
      }
    </script>
  </body>
</html>
