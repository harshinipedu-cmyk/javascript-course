<!DOCTYPE html>
<html>
  <head>
    <title>10-HomeWork</title>
    <style>
      .cart-button{
        background-color:rgb(255,216,20);
        color:black;
        padding: 8px 30px;
        border:none;
        border-radius:15px;
        margin-right: 10px;
      }
      .request-button{
        background-color:black;
        color:white;
        padding: 10px 15px;
        border:none;
        border-radius:5px;
        font-weight:bold;
        margin-right:15px;
      }
      .later-button{
        background-color:rgb(230,230,230);
        color: black;
        padding: 10px 15px;
        border:none;
        border-radius:5px;
        font-weight:bold;
      }
    </style>
  </head>
  <body>
    <button class="cart-button">Add to Cart</button>
    <button class="request-button">Request now</button>
    <button class="later-button">Schedule for later</button>
  </body>
</html>
