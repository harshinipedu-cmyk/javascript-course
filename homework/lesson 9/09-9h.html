<!DOCTYPE html>
<html>
  <head>
    <title>DOM</title>
  </head>
  <body>
    <input onkeyUp = "
      outputData();
    " placeholder="input data" class = "js-input">
  
    <p class = "js-output-data"></p>
    
    <script>
      function outputData(){
        const inputElement = document.querySelector('.js-input');
        const data = document.querySelector('.js-output-data');
        data.innerHTML = inputElement.value;
      }
    </script>
  </body>
</html>
