<!DOCTYPE html>

<html>
  <head>
    <title>09-HomeWork</title>
  </head>

  <body>
    <button class = "js-button-9a">9a</button>
    <button class = "js-button-9b">9b</button>
    <p></p>
    <button class = "js-heads" onclick="
      result('Heads');  
    ">Heads</button>
    <button class = "js-tails" onclick="
      result('Tails');  
    ">Tails</button>

    <p class="js-result"></p>

    <input class="js-input" placeholder="Name" onkeydown="
      enterKey(event);
    ">
    <button onclick="
      nameText();
    ">Submit</button>
    <p class="js-name"></p>
  </body>

  <script>
    const buttonElement1 = document.querySelector('.js-button-9a');
    console.log(buttonElement1);

    let buttonElement2 = document.querySelector('.js-button-9b');
    buttonElement2.innerHTML = '9b Done!';

    function result(selection){
      const resultParagraph = document.querySelector(".js-result");
      resultParagraph.innerHTML = `You chose: ${selection}`;
    }

    function nameText(){
      const inputElement = document.querySelector('.js-input');
      let text = inputElement.value

      const paraElement = document.querySelector('.js-name');
      paraElement.innerHTML = `Your Name is: ${text}`;
    }

    function enterKey(event){
        if (event.key === 'Enter'){
          nameText();
        }
      }
  </script>
</html>
