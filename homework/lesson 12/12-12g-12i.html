<!DOCTYPE html>
<html>
  <head>
    <title class="js-title">App</title>

    <style>
      
    </style>
  </head>

  <body>

    <button onclick="
      message ++
    ">Add</button>

    <button onclick = "
      message --
    ">Remove</button>

    <script>
      let message = 2;

      setInterval(function() {
        if (document.title === 'App' && message > 0) {
          document.title = `(${message}) New messages`;
        } else if(message <= 0) {
          document.title = 'App';
        } else {
          document.title = 'App';
        }
      }, 1000);
      
    </script>
  </body>
</html>
