    <script>
      
      const multiply = (param1,param2) => param1 * param2;
      console.log(multiply(2,3));
      console.log(multiply(0,5));
      console.log(multiply(5,9));
      

      const countPositive = (nums) => {
        let count = 0
        nums.forEach(value => {
          if(value > 0){
            count ++
          }
        });
        console.log(count);
      }

      countPositive([1,2,-1,0]);
      countPositive([1,3,-5]);
      countPositive([-2,3,-5,7,10]);
